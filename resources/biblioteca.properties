# Configuracao da instalacao. Qualquer chave pode ser sobrescrita na linha de comando com -Dchave=valor.

# Perfil de execucao: "teste" (familia em memoria) ou "producao" (familia relacional MySQL)
perfil=teste

# Banco da instalacao: A ou B (escolhe o adaptador de cobranca)
banco=A

# Politica de multa vigente: ORIGINAL, TETO_20 ou TOLERANCIA_2_DIAS
politica.multa=ORIGINAL

# Recursos opcionais da consulta ao acervo (decoradores)
consulta.cache=true
consulta.medicao=true

# Nome da unidade raiz da organizacao hierarquica do acervo
acervo.unidade=Central

# Familia relacional (somente no perfil producao). O Oracle e replica: nunca configure aqui.
jdbc.url=jdbc:mysql://localhost:3306/biblioteca?createDatabaseIfNotExist=true
jdbc.usuario=biblioteca
jdbc.senha=biblioteca
jdbc.criarEsquema=true
